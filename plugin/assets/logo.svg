<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Layer Bloom</title>
  <rect width="128" height="128" rx="28" fill="#6B0F35"/>
  <!-- Five petals, each the same ellipse turned 72° -->
  <g fill="#E3A1C0">
    <ellipse cx="64" cy="40" rx="15" ry="22"/>
    <ellipse cx="64" cy="40" rx="15" ry="22" transform="rotate(72 64 66)"/>
    <ellipse cx="64" cy="40" rx="15" ry="22" transform="rotate(144 64 66)"/>
    <ellipse cx="64" cy="40" rx="15" ry="22" transform="rotate(216 64 66)"/>
    <ellipse cx="64" cy="40" rx="15" ry="22" transform="rotate(288 64 66)"/>
  </g>
  <circle cx="64" cy="66" r="11" fill="#12936A"/>
</svg>
